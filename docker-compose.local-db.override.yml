# Opsional: tambahkan Postgres ke stack untuk mesin lokal (tanpa instance bersama).
# Buat jaringan sekali jika belum ada: docker network create shared_db_net
#
# docker compose -f docker-compose.prod.yml -f docker-compose.local-db.override.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: smart_pos_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_pos}
      POSTGRES_USER: ${POSTGRES_USER:-smart_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_pos}
    volumes:
      - smart_pos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_pos} -d ${POSTGRES_DB:-smart_pos}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-smart_pos}
      DATABASE_USERNAME: ${POSTGRES_USER:-smart_pos}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-smart_pos}

volumes:
  smart_pos_db:
