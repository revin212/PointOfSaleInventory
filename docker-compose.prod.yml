services:
  backend:
    build:
      context: ./backend
    container_name: smart_pos_backend
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/smart_pos}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-smart_pos}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-1209600}
      # Because frontend is served by the same origin, CORS can be tightened.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-Password123!}
      APP_SEED_FORCE_RESET_PASSWORDS: ${APP_SEED_FORCE_RESET_PASSWORDS:-false}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:-}
    networks:
      - default
      - shared_db_net
    restart: unless-stopped

  web:
    build:
      context: ./smart-pos-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: smart_pos_web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  shared_db_net:
    external: true
